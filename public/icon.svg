<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background with rounded squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Aura Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="6" opacity="0.3" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="160" fill="#4338ca" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Fluency Energy Wave -->
  <path d="M120 256 Q 188 200, 256 256 T 392 256" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Iconic Lightning Bolt of Accelerated Fluency -->
  <path d="M280 84 L164 274 L252 274 L220 428 L348 238 L260 238 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round" />
</svg>
